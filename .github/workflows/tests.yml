name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FoodDelivery.slnx

      - name: Build solution
        run: dotnet build FoodDelivery.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test FoodDelivery.slnx --no-build --configuration Release